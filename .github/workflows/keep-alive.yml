name: Keep Streamlit Apps Awake
on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch: # Allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping App 1 (Studio)
        run: curl -s -o /dev/null -w "%{http_code}\n" https://multi-modal-ai-studio-ygzdttxkduvvhthpd34jbx.streamlit.app/
        
      - name: Ping App 2 (Agent)
        run: curl -s -o /dev/null -w "%{http_code}\n" https://multi-modal-ai-agent-tqsusyxkx8so7cfgvzj9jq.streamlit.app/
